<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Software Jurídico</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-page">
        <!-- Panel Izquierdo: Branding / Presentación -->
        <div class="brand-panel">
            <div class="brand-content">
                <div class="logo-icon">⚖️</div>
                <h1>Despacho Jurídico</h1>
                <p>Gestión integral de atenciones, registro diario de clientes y seguimiento en tiempo real de casos legales.</p>
            </div>
        </div>

        <!-- Panel Derecho: Formulario de Login -->
        <div class="form-panel">
            <div class="form-container">
                <div class="login-header">
                    <h2>Iniciar Sesión</h2>
                    <p>Ingrese sus credenciales de acceso para ingresar al sistema.</p>
                </div>

                <form id="loginForm">
                    <div class="input-group">
                        <label for="usuario">Usuario</label>
                        <input type="text" id="usuario" placeholder="Ej. usuario_juridico" required autocomplete="off">
                    </div>

                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-submit">Ingresar al Sistema</button>
                    <p id="error-msg" class="error-msg"></p>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
